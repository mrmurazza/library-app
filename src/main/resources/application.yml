spring:
  application:
    name: library-app
  datasource:
    url: jdbc:postgresql://localhost:5432/library_app
    username: library_app
    password: library_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

library:
  max-active-loans: 3
  loan-duration-days: 14

server:
  port: 8080

info:
  app:
    name: library-app
    description: Catalog, members, and loans with config-driven borrowing rules.
