spring:
  application:
    name: library-app
  datasource:
    url: jdbc:postgresql://localhost:5432/library_app
    username: root
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

library:
  max-active-loans: 3
  loan-duration-days: 14

app:
  authentication:
    users:
      - username: admin@admin.com
        password: $2a$10$5mxv7rMtqDLJQAo03IiYvOpULZpNA.XL0h5Z0ApwlEQ.11NcvC1Xq
        role: ADMIN
      - username: razza@razza.com
        password: $2a$10$1U7GcuDtUdSOScHLXTYrV.LqS6okYhNdqwHzB/vP8KpYa8VvtfXMi
        role: MEMBER
      - username: rafif@rafif.com
        password: $2a$10$rIpwHWVDznIpJbcS3xgWXuwuqxBCmTuD3RTss2omuJwsWIUqVgi0S
        role: MEMBER

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: library-app
    description: Catalog, members, and loans with config-driven borrowing rules.

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{40} - %msg%n"
